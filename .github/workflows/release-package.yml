name: Release app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  image_name: smia-valgdata
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
      issues: read
      checks: write
      pull-requests: write
    uses: kartverket/smia-valgdata/.github/workflows/build-app.yml@main
    with:
      deploy_ghcr: true
    secrets: inherit

  pharos:
    name: Run Pharos security scan
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@446d11f033ffe30b4c91f885c3ad34ea3d8c6af7 # v0.7.0
        with:
          allow_severity_level: critical
          image_url: ${{ needs.build.outputs.image_url }}
          trivy_vex: "true"

  deploy-argo:
    permissions:
      id-token: write
      contents: read
    needs: [pharos, build]
    uses: kartverket/smia-workflows/.github/workflows/deploy-app.yml@main
    with:
      application: smia-valgdata
      version: ${{ needs.build.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
      environment: dev
      namespace: smia-tjenester-main
      identity: restapi
