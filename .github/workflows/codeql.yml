name: CodeQL
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '21 21 * * *'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['kotlin']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # 4.38.1
        with:
          languages: ${{ matrix.language }}
      - name: Setup Gradle Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx4g" >> ~/.gradle/gradle.properties

      # MIDLERTIDIG: CodeQL 2.27.0 støtter ikke Kotlin 2.4.20, så CodeQL-bygget
      # kompileres med 2.4.10. Vanlige bygg og artefakter bruker fortsatt 2.4.20.
      # TODO: Slett denne når codeql oppdateres!
      - name: Pin Kotlin 2.4.10 for CodeQL (temporary)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/codeql-kotlin.gradle <<'EOF'
          beforeSettings { settings ->
              settings.pluginManagement.resolutionStrategy.eachPlugin { details ->
                  if (details.requested.id.id.startsWith('org.jetbrains.kotlin')) {
                      details.useVersion('2.4.10')
                  }
              }
          }
          EOF

      - name: Build
        run: ./gradlew build -x test --info


      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # 4.38.1
